<div class="section bd-example"><ng-content></ng-content></div>
<div class="section">
  <div class="item">
    @if (html || ts || spec || style) {
      <tabset>
        @if (html) {
          <tab heading="template" [customClass]="'code-tab'">
            <pre class="prettyprint linenums lang-html">{{html}}</pre>
          </tab>
        }
        @if (ts) {
          <tab heading="component" [customClass]="'code-tab'">
            <pre class="prettyprint linenums lang-js">{{ts}}</pre>
          </tab>
        }
        @if (spec) {
          <tab heading="tests" [customClass]="'code-tab'">
            <pre class="prettyprint linenums lang-js">{{spec}}</pre>
          </tab>
        }
        @if (style) {
          <tab heading="style" [customClass]="'code-tab'">
            <pre class="prettyprint linenums lang-css">{{style}}</pre>
          </tab>
        }
      </tabset>
    }
  </div>
</div>
