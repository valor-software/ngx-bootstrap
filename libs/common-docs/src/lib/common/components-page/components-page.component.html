<demo-section>
  <h1>
    All Components
  </h1>

  <div class="pills-box">
    @for (item of componentsArray; track item) {
      <div class="pills-item" [routerLink]="'/components/' + item.path">
        @if (item.data) {
          <p>
            {{item.data[0]}}
          </p>
        }
      </div>
    }
  </div>

  <div class="components-box">
    @for (item of componentsArray; track item) {
      <div class="components-item col-xxl-3 col-xl-3 col-lg-4 col-sm-6 col-12">
        <div class="components-item-container" [routerLink]="'/components/' + item.path">
          <div class="components-img-box w-100">
            @if (item.data) {
              <img [src]="'assets/images/components-page/' + item.data[0].toLowerCase()+ '.png'" class="w-100" alt="">
            }
          </div>
          <div class="components-text-box d-flex align-items-center w-100">
            @if (item.data) {
              <p>{{item.data[0]}}</p>
            }
          </div>
        </div>
      </div>
    }
  </div>

</demo-section>
