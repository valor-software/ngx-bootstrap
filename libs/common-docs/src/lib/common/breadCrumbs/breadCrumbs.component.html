@if (routeArray && routeArray.length && routeArray.length > 1) {
  <div class="breadCrumbs-box">
    <ul class="p-0 m-0">
      <li (click)="navigate()">Home</li>
      @for (path of routeArray; track path; let i = $index) {
        <li (click)="navigate(i)" [class.disabled]="i === routeArray.length - 1">
          <span>/</span>{{path}}
        </li>
      }
    </ul>
  </div>
}
