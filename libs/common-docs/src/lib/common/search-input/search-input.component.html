<form>
  <div class="input-container" [class.hideInput]="!showInput">
    <input
      #searchInput
      type="text"
      aria-label="Search in docs"
      name="search"
      placeholder="Search..."
      [value]="search.text"
      (keyup)="search.text = searchInput.value"
      (keypress)="preventReloading($event)"
      />
    </div>
  </form>

  @if (search.text && routes.length) {
    <ul class="sidebar-list menu" data-cypress="search-result">
      @for (route of routes | slice :4 | SearchFilter : search.text; track route) {
        @if (route.path) {
          <li
            [routerLinkActive]="['active']"
            [routerLinkActiveOptions]="{exact: true}"
            class="w-100"
            (click)="search.text = ''"
            >
            <a [routerLink]="getRouteLink(route.path)" class="text-white d-block w-100">{{route.data[0]}}</a>
          </li>
        }
      }
    </ul>
  }
