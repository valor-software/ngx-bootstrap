@if (section) {
  <h2 [id]="section.anchor">{{ section.name }}</h2>
  @if (section.importInfo) {
    <pre class="prettyprint lang-bash prettyprinted" [innerHTML]="section.importInfo"></pre>
  }
  @if (section.usage) {
    <pre class="prettyprint lang-typescript" [innerHTML]="section.usage.default"></pre>
  }
  @for (item of apiSectionsContent; track item) {
    <ng-container *ngComponentOutlet="item.outlet; injector: sectionInjections(item)">
    </ng-container>
  }
}
