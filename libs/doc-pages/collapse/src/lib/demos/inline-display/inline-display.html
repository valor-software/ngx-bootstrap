<button type="button" class="btn btn-success" (click)="setDisplay('inline-block')"
        aria-controls="collapseBasic">Inline-block
</button>
<button type="button" class="btn btn-primary" (click)="setDisplay('none')"
        aria-controls="collapseBasic">None
</button>
<hr>
<div id="collapseBasic" [collapse]="!isCollapsed" [display]="displayValue" #collapse="bs-collapse">
  <div class="well well-lg card card-block card-header">Some content</div>
</div>
