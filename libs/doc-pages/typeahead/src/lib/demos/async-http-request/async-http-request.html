<pre class="card card-block card-header">Model: {{ search | json }}</pre>

<input [(ngModel)]="search"
  typeaheadOptionField="login"
  [typeahead]="suggestions$"
  [typeaheadAsync]="true"
  class="form-control"
  placeholder="Enter GitHub username">

  @if (errorMessage) {
    <div class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>
  }
